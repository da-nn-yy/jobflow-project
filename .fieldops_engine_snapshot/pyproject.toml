[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldops-engine"
version = "0.1.0"
description = "Field service work-order orchestration and dispatch workflow engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
fieldops = "fieldops.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["fieldops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["fieldops"]
omit = ["fieldops/catalog/playbooks/*"]

[tool.coverage.report]
fail_under = 55
show_missing = true
